name: Release deck PDF

# Push a tag like "v1.0.0" to trigger: exports slides.md to PDF and attaches
# it to a Forgejo release for that tag, so it's viewable via a direct link
# (Forgejo renders PDF release assets inline in the browser).
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    # Adjust this label to match a runner actually registered on this repo
    # (see Settings > Actions > Runners) if "docker" isn't one of them.
    runs-on: docker
    steps:
      - name: Checkout
        uses: https://data.forgejo.org/actions/checkout@v4

      - name: Use HTTPS for code.bonhamlab.bio (repo is public; avoids needing SSH keys in CI)
        run: git config --global url."https://code.bonhamlab.bio/".insteadOf "ssh://git@code.bonhamlab.bio:443/"

      - name: Install bun
        run: |
          curl -fsSL https://bun.sh/install | bash
          echo "$HOME/.bun/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: bun install

      - name: Install Playwright Chromium
        run: bunx playwright install --with-deps chromium

      - name: Export deck to PDF
        run: |
          mkdir -p dist/release
          bunx slidev export slides.md --output "dist/release/${{ github.event.repository.name }}.pdf"

      - name: Upload PDF to release
        uses: https://code.forgejo.org/actions/forgejo-release@v2.13.4
        with:
          direction: upload
          url: ${{ github.server_url }}
          repo: ${{ github.repository }}
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ github.ref_name }}
          release-dir: dist/release
          release-notes: "Slide deck for ${{ github.ref_name }}. Click the PDF asset below to view it in your browser."
          # Without this, the action errors (409) if a release for this tag
          # already exists (e.g. you made one by hand in the UI before/after
          # tagging). With it, re-running just replaces the release's assets
          # and text — so a hand-written title/body here will get overwritten.
          override: true
